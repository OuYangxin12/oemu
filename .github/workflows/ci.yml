name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Matrix over compiler and configuration. Runs exactly the same commands a
  # developer runs locally: cmake --preset ... && ctest --preset ...
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug
            preset: debug
          - name: clang-debug
            preset: clang
          - name: release
            preset: release
          - name: asan-ubsan
            preset: asan
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgtest-dev libgmock-dev clang

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2
        env:
          # Make sanitizer findings fail the job loudly.
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  # L2/L3: the cross toolchain turns the guest suite from silent skips into
  # real assertions (roadmap M4b: "CI ... gains a `guest` job installing
  # gcc-aarch64-linux-gnu"), and the boot gate replays the oracle's markers
  # whenever a kernel Image is on hand. The roadmap's standing assumption is
  # that images stay out of the tree, so the gate skips cleanly rather than
  # failing -- a skip that names why is honest; a green that hides a skip is not.
  guest:
    name: guest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgtest-dev libgmock-dev gcc-aarch64-linux-gnu

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build build/debug --parallel

      - name: "L2 guest tests (real run: the cross pair above is why this job exists)"
        run: ctest --preset debug -L guest --output-on-failure

      - name: L3 Linux boot gate (skips cleanly when the Image is absent)
        run: |
          if [ -f guest/build/Image ]; then
            scripts/boot-linux-gate.sh
          else
            echo "skipped: guest/build/Image is not on the runner (kernel images stay out of the tree)"
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgtest-dev libgmock-dev lcov

      - name: Configure and build
        run: |
          cmake --preset coverage
          cmake --build build/coverage --parallel

      - name: Generate coverage report
        run: cmake --build build/coverage --target coverage

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage/coverage-html
          if-no-files-found: error

  lint:
    name: format and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # The versioned packages, not the metapackages: a formatting verdict must
        # not depend on which LLVM the runner image happens to carry. clang-format
        # 18 and 21 disagree about the same source line, and 18's preferred spelling
        # of one corpus expression is one 21 rejects -- so the tool is pinned here
        # and passed to the Makefile, which a developer runs the same way
        # (make format-check CLANG_FORMAT=clang-format-18).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgtest-dev libgmock-dev clang-format-18 clang-tidy-18

      - name: Check formatting
        run: make format-check CLANG_FORMAT=clang-format-18

      # Runs the same Makefile target a developer runs. Invoking clang-tidy
      # directly here would drop the flags that target sets -- notably
      # -Wno-unknown-warning-option, needed because the GCC-generated
      # compile_commands.json carries GCC-only warning flags that Clang rejects
      # as errors.
      - name: Run clang-tidy
        run: make tidy CLANG_TIDY=clang-tidy-18
